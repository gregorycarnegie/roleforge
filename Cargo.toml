[package]
name = "roleforge"
version = "0.2.2"
edition = "2024"
description = "Job-market intelligence and resume-aware role matching"
license = "MIT"
repository = "https://github.com/gregorycarnegie/roleforge"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
log = "0.4.34"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
url = "2.5.8"

[dev-dependencies]
proptest = "1.12.0"
rstest = { version = "0.27.0", default-features = false }
tempfile = "3.27.0"

# Release codegen plus line tables, so a sampling profiler resolves frames to
# source. Separate from `release` so normal builds stay small.
#
#   cargo build --profile profiling
#   samply record ./target/profiling/roleforge.exe pull
[profile.profiling]
inherits = "release"
debug = 1
